name: Send appointment reminders (fallback)

# FALLBACK ONLY as of 2026-07-25 — the primary scheduler for this job is now
# Supabase pg_cron + pg_net (job name "send-appointment-reminders", every 15
# min, calls the same /api/cron/send-reminders endpoint). That change was
# made because real GitHub Actions run history showed schedule jitter of
# 1h50m–3h11m against a nominal 15-minute cron — too loose for reminder
# windows that are only ±15min wide. pg_cron runs inside Supabase's own
# Postgres instance instead of a shared Actions scheduler queue, which is
# significantly more dependable for tight timing. See
# docs/reminders-build-log.md for the full writeup.
#
# This workflow is kept as a manual fallback (run it by hand from the Actions
# tab, or re-enable the `schedule:` trigger below) in case the Supabase side
# ever needs to be bypassed. It intentionally has NO `schedule:` trigger —
# only workflow_dispatch — so it does not double-send alongside pg_cron.
# Sending is idempotent either way (reminder_24h_sent_at / reminder_1h_sent_at
# guards), so even a manual run overlapping with pg_cron is harmless.
on:
  workflow_dispatch: {} # manual runs from the Actions tab only — see note above

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-reminders endpoint
        run: |
          response=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://kalendar.kaminolabs.dev/api/cron/send-reminders")
          echo "HTTP status: $response"
          cat /tmp/response.txt
          if [ "$response" -ge 400 ]; then
            echo "Reminders endpoint returned an error"
            exit 1
          fi

